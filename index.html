<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/main.css">
</head>
<body>
    <main>
        <div class="container g-0" id="container-cadastro">
            <div class="row">
                <h1>F1 Daily</h1>
                <p>O canal de notícias oficial da F1 Dream</p>
                <div class="col-6 d-flex align-itens-center">
                    <img src="./images/app.png" id="img-intro">
                </div>
                <div class="col-6">
                    <h2>Faça seu cadastro:</h2>
                    <form>
                        <label class="form-label mb-0" for="nome">Seu nome:</label>
                        <input class="form-control mb-2" type="text" id="nome" required>
                        <label class="form-label mb-0" for="email">Seu e-mail:</label>
                        <input class="form-control mb-2" type="email" id="email" required>
                        <label class="form-label mb-0" for="telefone">Seu telefone:</label>
                        <input class="form-control mb-2" type="tel" id="telefone" required></textarea>
                        <div class="form-check">
                            <label class="form-check-label" for="aceito-termos">Li e concordo com os termos do site</label>
                            <input class="form-check-input" type="checkbox" id="aceito-termos">
                        </div>
                        <button class="btn btn-success mt-2 w-100">Enviar</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
