<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício boas práticas de CSS</title>
    <link rel="stylesheet" href="./bem/main.css">
</head>
<body>
    <div class="produtos">
        <div class="produto">
            <img class="produto__imagem" src="https://placehold.co/100x100">
            <h4 class="produto__nome">Nome do produto</h4>
            <p class="produto__descricao">
                Descrição do produto
            </p>
        </div>
        <div class="produto">
            <img class="produto__imagem" src="https://placehold.co/100x100">
            <h4 class="produto__nome">Nome do produto</h4>
            <p class="produto__descricao">
                Descrição do produto
            </p>
        </div>
        <div class="produto">
            <img class="produto__imagem" src="https://placehold.co/100x100">
            <h4 class="produto__nome">Nome do produto</h4>
            <p class="produto__descricao">
                Descrição do produto
            </p>
        </div>
    </div>
    <script>
        const destaque = document.querySelectorAll('.produto');
        console.log(destaque)
        for (let i = 0; i < destaque.length; i++) {
            destaque[i].addEventListener('mouseenter', function(e){
                e.target.classList.add('produto--em-destaque');
            })
            destaque[i].addEventListener('mouseleave', function(e){
                e.target.classList.remove('produto--em-destaque');
            })
        }
    </script>
</body>
</html>
